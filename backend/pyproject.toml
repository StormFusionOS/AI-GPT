[tool.poetry]
name = "ai-seo-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for the AI SEO Dashboard"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.2"
uvicorn = { extras = ["standard"], version = "^0.27.1" }
sqlalchemy = "^2.0.25"
psycopg = { version = "^3.1.18", extras = ["binary"] }
redis = "^5.0.1"
celery = "^5.3.6"
qdrant-client = "^1.7.0"
langchain = "^0.1.7"
python-dotenv = "^1.0.1"
pydantic-settings = "^2.2.1"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
pyjwt = "^2.8.0"
httpx = "^0.26.0"
prometheus-client = "^0.19.0"
structlog = "^24.1.0"
alembic = "^1.13.1"
python-socketio = "^5.11.2"
beautifulsoup4 = "^4.12.3"
lxml = "^5.1.0"
playwright = "^1.42.0"
aiofiles = "^23.2.1"
psutil = "^5.9.8"
croniter = "^2.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.4"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
