# Nginx reverse proxy configuration enforcing CRM/Ops separation.
# Each virtual host proxies only to its respective application tier
# and blocks cross-origin requests to the other API surface.

worker_processes auto;

http {
    upstream crm_frontend {
        server crm-frontend:4173;
    }

    upstream crm_api {
        server crm-api:8000;
    }

    upstream ops_frontend {
        server ops-frontend:4173;
    }

    upstream ops_api {
        server ops-api:8000;
    }

    map $http_origin $block_ops_from_crm {
        default 0;
        "https://crm.example.com" 1;
    }

    server {
        listen 80;
        server_name crm.example.com;

        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://crm.example.com" always;
        add_header X-Content-Type-Options nosniff;

        location / {
            proxy_pass http://crm_frontend;
        }

        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://crm_api;
        }
    }

    server {
        listen 80;
        server_name ops.example.com;

        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://ops.example.com" always;
        add_header X-Content-Type-Options nosniff;

        location / {
            proxy_pass http://ops_frontend;
        }

        location /api/ {
            if ($block_ops_from_crm) {
                return 403;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://ops_api;
            add_header Access-Control-Allow-Origin "https://ops.example.com" always;
        }
    }
}
