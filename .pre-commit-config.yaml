repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: enforce-migrations
        name: ensure migrations accompany model changes
        entry: python tools/check_migrations.py
        language: system
        pass_filenames: true
        files: ""
