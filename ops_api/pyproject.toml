[tool.poetry]
name = "ops-api"
version = "0.1.0"
description = "Ops & SEO API service"
authors = ["AI Engineer <ai@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
sqlalchemy = "^2.0.25"
psycopg = {extras = ["binary"], version = "^3.1.16"}
alembic = "^1.12.1"
pydantic-settings = "^2.0.3"
python-jose = "^3.3.0"
PyJWT = "^2.9.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
structlog = "^23.2.0"
httpx = "^0.25.2"
celery = "^5.3.6"
redis = "^5.0.1"
psutil = "^5.9.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
httpx = "^0.25.2"

[tool.pytest.ini_options]
addopts = "-q"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
